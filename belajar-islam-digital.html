<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#122019"><meta name="description" content="Panduan belajar Islam di internet: cara memeriksa sumber ayat dan hadis, mengenali kredibilitas pembicara, memahami konteks, dan belajar secara bertanggung jawab."><meta name="robots" content="index,follow"><link rel="canonical" href="https://rllibo833-sudo.github.io/kawasan-masjid-public/belajar-islam-digital.html"><meta property="og:type" content="article"><meta property="og:title" content="Belajar Islam di Internet: Cara Memeriksa Sumber dengan Bijak"><meta property="og:description" content="Lima kebiasaan untuk memeriksa sumber, pembicara, konteks, dan penjelasan agama di era digital."><meta property="og:url" content="https://rllibo833-sudo.github.io/kawasan-masjid-public/belajar-islam-digital.html"><title>Belajar Islam di Internet: Cara Memeriksa Sumber dengan Bijak | Kawasan Masjid</title></head><body><div id="root"></div><noscript><main><h1>Belajar Islam di internet: bagaimana memeriksa sumber dengan bijak?</h1><p>Internet memudahkan pencarian kajian, ayat, hadis, dan penjelasan agama. Periksa sumber asli, kredibilitas pembicara, konteks, dan bandingkan penjelasan dari sumber tepercaya. Halaman ini adalah bahan edukasi dan literasi digital, bukan fatwa.</p><p>Riset: <a href="https://doi.org/10.1080/01416200.2024.2368888">studi penggunaan internet untuk pembelajaran Islam di dua SMA di Indonesia</a> dan <a href="https://doi.org/10.4102/hts.v80i1.9510">studi pembelajaran Islam daring pada remaja Muslim di Jepara</a>.</p></main></noscript><script type="module" src="./src/main.jsx"></script></body></html>
